# Diagnostic: does the Cloudflare challenge on staatsoper.de clear from each
# runner pool when loaded with the project's Selenium setup? Manual dispatch
# only. Remove once the runner pool for the staatsoper scraper is chosen.
name: Staatsoper Cloudflare probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: pip install --upgrade --force-reinstall -r requirements.txt
      - name: Probe
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          ip=$(curl -s -m 15 https://api.ipify.org || echo unknown)
          echo "RESULT runner=$RUNNER_LABEL egress_ip=$ip"
          PYTHONPATH=. python3 -u - <<'PY'
          import os, time, utils
          runner = os.environ['RUNNER_LABEL']
          t = time.time()
          driver = utils.get_selenium_driver()
          html = utils.get_html_selenium('https://www.staatsoper.de/spielplan', driver)
          title = driver.title
          blocked = ('Just a moment' in title) or ('you have been blocked' in html)
          print(f"RESULT runner={runner} page=spielplan title={title!r} blocked={blocked} seconds={time.time()-t:.0f}")
          t = time.time()
          html = utils.get_html_selenium('https://www.staatsoper.de/spielplan/2026-10/activities.ajax', driver)
          n = len(utils.make_soup(html).find_all(class_='activity-group'))
          print(f"RESULT runner={runner} page=activities.ajax activity_groups={n} seconds={time.time()-t:.0f}")
          # same endpoint, but requested from inside the loaded page like the site's own JS does
          js = '''
          const [url, done] = [arguments[0], arguments[arguments.length - 1]];
          fetch(url, {headers: {'X-Requested-With': 'XMLHttpRequest'}, credentials: 'same-origin'})
            .then(r => r.text().then(t => done({status: r.status, text: t})))
            .catch(e => done({status: -1, text: String(e)}));
          '''
          driver.set_script_timeout(60)
          for month in ['2026-09', '2026-10', '2027-05']:
              t = time.time()
              res = driver.execute_async_script(js, f'https://www.staatsoper.de/spielplan/{month}/activities.ajax')
              n = len(utils.make_soup(res['text']).find_all(class_='activity-group'))
              print(f"RESULT runner={runner} xhr={month} http={res['status']} activity_groups={n} challenge={'Just a moment' in res['text']} seconds={time.time()-t:.1f}")
          driver.quit()
          PY
